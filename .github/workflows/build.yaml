name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      maintenance:
        description: Publish existing artifacts without rebuilding
        type: choice
        default: none
        options:
          - none
          - publish-dev
          - refresh-rs-uploads

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.maintenance || 'none' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.maintenance != 'publish-dev' && inputs.maintenance != 'refresh-rs-uploads' }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  # See CI Caches in .agents/commands.md.
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.3'
  NDK_VERSION: r28c

jobs:
  dart:
    name: Dart
    # A private copy pays for its Actions minutes, so it runs the checks only when
    # started by hand.
    if: &checks (github.event_name == 'workflow_dispatch' || !github.event.repository.private) && inputs.maintenance != 'publish-dev' && inputs.maintenance != 'refresh-rs-uploads'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Analyze with the rsFeature checks stripped
        run: bash tool/strip_check.sh

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: dart run tool/test.dart -- --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    name: Plugins
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  desktop:
    name: Desktop ${{ matrix.platform }}
    if: (github.event_name == 'workflow_dispatch' || !github.event.repository.private) && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && inputs.maintenance != 'publish-dev' && inputs.maintenance != 'refresh-rs-uploads'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      # Compiles the desktop runners and the native plugin code that only the
      # tagged release matrix built before; the bundle itself is discarded.
      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

  go:
    name: Go core
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./cmd ./mobile ./platform ./timezone ./tun)" || {
            gofmt -l ./*.go ./cmd ./mobile ./platform ./timezone ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet . ./cmd/...
          GOOS=linux go vet ./platform

      - name: Validate the Android core library
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          GOOS=android GOARCH=arm64 go vet "-tags=$tags" . ./mobile ./tun ./platform

      - name: Test Miu and REALITY compatibility
        working-directory: core/Clash.Meta
        run: |
          go test -count=1 ./adapter ./adapter/outbound ./common/convert ./component/tls ./transport/miu
          go test -race -count=1 ./component/tls ./transport/miu

  android:
    name: Android unit tests
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          # No JVM unit test loads the Core or the Flutter build, but `:core` compiles against
          # the gomobile AAR, so one ABI of it is built.
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    if: *checks
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  version:
    name: Version
    # Releases publish where the release links point: the public repository.
    if: &release github.repository == 'xiangwan6667/FlClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      # Android refuses a lower versionCode, so the clock-based build number never drops below pubspec's.
      - name: Resolve the version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-pre\.[0-9]+(\+[0-9]+)?)?$ ]]; then
            echo "::error::$TAG is neither vX.Y.Z nor vX.Y.Z-pre.N[+M]"
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          committed="$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          build="$(date -u +%Y%m%d%H)"
          if ((build <= ${committed:-0})); then
            build=$((committed + 1))
          fi
          echo "version=$name+$build" >> "$GITHUB_OUTPUT"
          echo "$TAG builds $name+$build"

  build:
    if: *release
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
            flutter-channel: master
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            flutter-channel: master

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply the tag's version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed "s/^version: .*/version: $VERSION/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE" "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD"; do
            test -n "$value" || { echo 'Android release signing secrets are missing.' >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
          # The setup hook builds the Core for the host slice only, so an x86_64 slice in the arm64 app cannot run.
          FLUTTER_MACOS_ARM64_ONLY: ${{ matrix.platform == 'macos' && matrix.arch == 'arm64' }}
        # `dart run` first runs every build hook for this runner, Linux GTK and the Go core included; the packager builds them for the target itself.
        run: dart tool/package.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Verify Windows installer publisher
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path dist -Filter '*-windows-${{ matrix.arch }}-setup.exe' -File)
          if ($installers.Count -ne 1 -or -not [string]::IsNullOrWhiteSpace($installers[0].VersionInfo.CompanyName)) {
            throw 'Expected one Windows installer with an empty publisher.'
          }

      - name: Verify macOS package identity
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.artifacts[0].version' dist/manifest.json)"
          mountpoint="$(mktemp -d)"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; rmdir "$mountpoint"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "dist/FlClash-dev-${version}-macos-${{ matrix.arch }}.dmg"
          app="$mountpoint/FlClash-dev/FlClash.app"
          test -d "$app"
          test ! -e "$mountpoint/FlClash.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'app.flclash.fork.dev'

      - name: Verify Linux package identity
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.artifacts[0].version' dist/manifest.json)"
          deb="dist/FlClash-dev-${version}-linux-${{ matrix.arch }}.deb"
          rpm="dist/FlClash-dev-${version}-linux-${{ matrix.arch }}.rpm"
          test "$(dpkg-deb -f "$deb" Package)" = 'flclash-dev'
          expected='FlClash Fork <noreply@localhost>'
          test "$(dpkg-deb -f "$deb" Maintainer)" = "$expected"
          dpkg-deb -c "$deb" | grep -F './opt/FlClash-dev/FlClash-dev' >/dev/null
          test "$(rpm -qp --qf '%{NAME}' "$rpm")" = 'flclash-dev'
          test "$(rpm -qp --qf '%{PACKAGER}' "$rpm")" = "$expected"
          rpm -qpl "$rpm" | grep -Fx '/usr/share/applications/flclash-dev.desktop' >/dev/null

      - name: Verify Android package identity and signature
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          shopt -s nullglob
          apks=(dist/*android*.apk)
          test "${#apks[@]}" -eq 3
          for apk in "${apks[@]}"; do
            "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='app.flclash.fork.dev'" >/dev/null
            certificates="$("$build_tools/apksigner" verify --print-certs "$apk")"
            if ! printf '%s\n' "$certificates" | grep -Fi 'certificate SHA-256 digest: 923e4c3eda8c6b516719b5b30f6e52e9faba273101368c6ce5a3bfdd74f40a33' >/dev/null; then
              echo "Unexpected signing certificate in $apk" >&2
              printf '%s\n' "$certificates" >&2
              exit 1
            fi
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [ version, build, dart, plugins, go, android, rust, windows-helper-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Apply the tag's version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/
          pattern: artifact-*

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Merge the build manifests
        run: dart run tool/package.dart merge artifacts/* --out dist

      - name: Generate release notes
        shell: bash
        env:
          IS_STABLE: ${{ env.IS_STABLE }}
          TAG: ${{ github.ref_name }}
        run: |
          target=()
          if [[ "$IS_STABLE" == 'true' ]]; then
            target=(--tag "$TAG")
          else
            dart run tool/changelog.dart build --unreleased
          fi
          dart run tool/changelog.dart render release "${target[@]}" --out release.md

      - name: Patch release.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf "\n<!-- flclash:build-number:%s -->\n" "${VERSION##*+}" >> release.md
          line=$(jq -r '.artifacts[0].line' dist/manifest.json)
          version=$(jq -r '.artifacts[0].version' dist/manifest.json)
          sed -e "s|TAG|${{ github.ref_name }}|g" -e "s|LINE|$line|g" -e "s|VERSION|$version|g" \
            ./.github/release_template.md >> release.md

      # Dev-line apps released before these names update from the old names; keep until the user says stop.
      - name: Copy the Windows installers and APKs under their old names
        run: |
          cd ./dist
          jq -r --arg version "${GITHUB_REF_NAME#v}" '.artifacts[]
            | select(.line == "dev")
            | select((.os == "windows" and .form == "setup") or .os == "android")
            | [.name, "FlClash-\($version)-" + (
                if .os == "windows" then "windows-\(.arch)-setup.exe"
                else "android-" + {arm64: "arm64-v8a", armv7: "armeabi-v7a", amd64: "x86_64"}[.arch] + ".apk"
                end)]
            | @tsv' manifest.json |
            while IFS=$'\t' read -r name legacy; do
              cp "$name" "$legacy"
              sha256sum "./$legacy" >> SHA256SUMS
            done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_STABLE != 'true' }}
          make_latest: ${{ env.IS_STABLE == 'true' }}

  publish-existing:
    name: Publish existing artifacts
    if: github.repository == 'xiangwan6667/FlClash' && github.event_name == 'workflow_dispatch' && (inputs.maintenance == 'publish-dev' || inputs.maintenance == 'refresh-rs-uploads')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        if: inputs.maintenance == 'publish-dev'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Download successful dev artifacts
        if: inputs.maintenance == 'publish-dev'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44331682087
          pattern: artifact-*
          path: artifacts

      - name: Setup Flutter
        if: inputs.maintenance == 'publish-dev'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Prepare existing dev packages and English notes
        if: inputs.maintenance == 'publish-dev'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse v0.9.4-pre.2)" = 8774c99828db6d790ebb00bacd8af260d74b580d
          git -c 'url.https://github.com/.insteadOf=git@github.com:' submodule update --init --depth 1 plugins/prism_ui
          flutter pub get
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart tool/package.dart merge artifacts/* --out dist
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('dist/manifest.json').read_text())
          entries = manifest['artifacts']
          expected = {
              *(f'android-{arch}.apk' for arch in ('amd64', 'arm64', 'armv7')),
              *(f'windows-{arch}-{form}' for arch in ('amd64', 'arm64') for form in ('setup.exe', 'portable.zip')),
              *(f'linux-{arch}.{form}' for arch in ('amd64', 'arm64') for form in ('AppImage', 'deb', 'rpm')),
              'macos-amd64.dmg',
          }
          names = {'FlClash-dev-0.9.4-pre.2-' + suffix for suffix in expected}
          assert {entry['name'] for entry in entries} == names
          assert len(entries) == len(names) == 14
          for entry in entries:
              assert entry['line'] == 'dev'
              assert entry['version'] == '0.9.4-pre.2'
              assert entry['commit'] == '8774c99828db6d790ebb00bacd8af260d74b580d'
              artifact = Path('dist') / entry['name']
              assert artifact.stat().st_size == entry['size']
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == entry['sha256']
          PY
          cd dist
          jq -r '.artifacts[]
            | select((.os == "windows" and .form == "setup") or .os == "android")
            | [.name, "FlClash-\(.version)-" + (
                if .os == "windows" then "windows-\(.arch)-setup.exe"
                else "android-" + {arm64: "arm64-v8a", armv7: "armeabi-v7a", amd64: "x86_64"}[.arch] + ".apk"
                end)] | @tsv' manifest.json |
          while IFS=$'\t' read -r name legacy; do
            cp "$name" "$legacy"
            sha256sum "$legacy" >> SHA256SUMS
          done
          cd ..
          dart tool/changelog.dart build --unreleased
          dart tool/changelog.dart render release --out release.md
          python3 - <<'PY'
          import re
          from pathlib import Path

          notes = Path('release.md').read_text()
          pending = '### macOS ARM64 package pending\n\nThe macOS ARM64 package will be added later because GitHub-hosted runner capacity is currently unavailable.\n\n'
          template = Path('.github/release_template.md').read_text()
          template = template.replace('TAG', 'v0.9.4-pre.2').replace('LINE', 'dev').replace('VERSION', '0.9.4-pre.2')
          template = re.sub(r'<a href="[^"\n]*FlClash-dev-0\.9\.4-pre\.2-macos-arm64\.dmg"[^\n]*</a>', 'macOS ARM64 package pending', template)
          result = pending + notes + '\n<!-- flclash:build-number:2026111815 -->\n' + template
          assert not re.search(r'[\u4e00-\u9fff]', result)
          assert '/FlClash-dev-0.9.4-pre.2-macos-arm64.dmg' not in result
          Path('release.md').write_text(result)
          PY
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 22

      - name: Remove only the superseded personal draft
        if: inputs.maintenance == 'publish-dev'
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/{owner}/{repo}/releases --paginate --jq '.[] | select(.tag_name == "v0.9.4-pre.2")' > previous-release.json
          if test -s previous-release.json; then
            if test "$(jq -r .author.login previous-release.json)" != 'github-actions[bot]'; then
              test "$(jq -r .draft previous-release.json)" = true
              gh api --method DELETE "repos/{owner}/{repo}/releases/$(jq -r .id previous-release.json)"
            fi
          fi

      - name: Publish dev with the workflow identity
        if: inputs.maintenance == 'publish-dev'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v0.9.4-pre.2
          name: v0.9.4-pre.2
          files: ./dist/*
          body_path: release.md
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true

      - name: Verify dev publication identity and digests
        if: inputs.maintenance == 'publish-dev'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          release = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/{owner}/{repo}/releases/tags/v0.9.4-pre.2',
          ], text=True))
          assert release['author']['login'] == 'github-actions[bot]'
          assert release['prerelease'] and not release['draft']
          assert not re.search(r'[\u4e00-\u9fff]', release['body'])
          assert '<!-- flclash:build-number:2026111815 -->' in release['body']
          files = {artifact.name: artifact for artifact in Path('dist').iterdir() if artifact.is_file()}
          assert len(files) == len(release['assets']) == 22
          assert set(files) == {asset['name'] for asset in release['assets']}
          for asset in release['assets']:
              content = files[asset['name']].read_bytes()
              assert asset['uploader']['login'] == 'github-actions[bot]'
              assert len(content) == asset['size']
              assert 'sha256:' + hashlib.sha256(content).hexdigest() == asset['digest']
          PY

      - name: Refresh only the corrected Windows upload identity
        if: inputs.maintenance == 'refresh-rs-uploads'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def github(*arguments):
              return subprocess.check_output(['gh', *arguments], text=True)

          endpoint = 'repos/{owner}/{repo}/releases/tags/v0.9.4-rs.2'
          before = json.loads(github('api', endpoint))
          assert before['author']['login'] == 'github-actions[bot]'
          assert len(before['assets']) == 17
          names = {
              'FlClash-rs-0.9.4-rs.2-windows-amd64-setup.exe',
              'FlClash-rs-0.9.4-rs.2-windows-arm64-setup.exe',
              'FlClash-rs-0.9.4-rs.2-SHA256SUMS',
              'manifest.json',
          }
          directory = Path('corrected-windows')
          directory.mkdir()
          for name in sorted(names):
              github('release', 'download', 'v0.9.4-rs.2', '--pattern', name, '--dir', str(directory))
              asset = next(asset for asset in before['assets'] if asset['name'] == name)
              content = (directory / name).read_bytes()
              assert len(content) == asset['size']
              assert 'sha256:' + hashlib.sha256(content).hexdigest() == asset['digest']
          github('release', 'upload', 'v0.9.4-rs.2', *(str(directory / name) for name in sorted(names)), '--clobber')
          after = json.loads(github('api', endpoint))
          assert after['id'] == before['id']
          assert after['author']['login'] == 'github-actions[bot]'
          assert after['body'] == before['body']
          assert len(after['assets']) == 17
          for original in before['assets']:
              current = next(asset for asset in after['assets'] if asset['name'] == original['name'])
              assert current['digest'] == original['digest']
              assert current['size'] == original['size']
              if original['name'] in names:
                  assert current['uploader']['login'] == 'github-actions[bot]'
              else:
                  assert current['id'] == original['id']
          PY
